[package]
name = "meetily"
version = "0.1.1"
description = "A Tauri App for meeting minutes"
authors = ["Sujith S"]
license = "MIT"
repository = "https://github.com/Zackriya-Solutions/meeting-minutes"
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# ============================================================
# FEATURES — FINAL FIXED VERSION (WSL-safe, CPU-only)
# ============================================================
[features]
default = ["cpu-only"]

# Force CPU-only mode on all platforms
cpu-only = ["whisper-rs/raw-api"]

# GPU features intentionally disabled for WSL/Linux
metal = []
coreml = []
cuda = []
vulkan = []
hipblas = []
openblas = []

# ============================================================
# BUILD DEPENDENCIES
# ============================================================
[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }
reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }
which = "6.0.1"

# ============================================================
# DEPENDENCIES
# ============================================================
[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
once_cell = "1.17.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
posthog-rs = "0.3.7"

cpal = "0.15.3"
clap = { version = "4.3", features = ["derive"] }
chrono = { version = "0.4.31", features = ["serde"] }

log = "0.4"
env_logger = "0.11"
tracing = "0.1.40"
which = "6.0.1"

bytemuck = "1.16.1"
ebur128 = "0.1"
nnnoiseless = "0.5"

# ============================================================
# WHISPER-RS — CPU-ONLY, FIXED
# ============================================================
whisper-rs = { version = "0.13.2", default-features = false, features = ["raw-api"] }

futures-util = "0.3"
silero_rs = { git = "https://github.com/emotechlab/silero-rs", rev = "26a6460", package = "silero" }

# ============================================================
# PARAKEET / ONNX — CPU ONLY (NO GPU EPs)
# ============================================================
# ort = { version = "2.0.0-rc.10", default-features = false, features = ["core"] }
# Parakeet / ONNX — CPU ONLY
ort = { version = "2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }

thiserror = "2.0.16"

tokio = { version = "1.32.0", features = ["full", "tracing"] }
async-trait = "0.1"
reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }

crossbeam = "0.8.4"
dashmap = "6.1.0"
dirs = "5.0.1"
url = "2.5.0"
sysinfo = "0.32"

lazy_static = "1.4.0"
realfft = "3.4.0"
regex = "1.11.0"
ndarray = "0.16"
bytes = { version = "1.9.0", features = ["serde"] }

esaxx-rs = "0.1.10"
symphonia = { version = "0.5.4", features = ["aac", "isomp4", "opt-simd"] }
rand = "0.8.5"
rubato = "0.15.0"
ringbuf = "0.4.8"

ffmpeg-sidecar = { git = "https://github.com/nathanbabcock/ffmpeg-sidecar", branch = "main" }

sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }

# ============================================================
# Tauri Dependencies
# ============================================================
tauri = { version = "2.6.2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
tauri-plugin-fs = "2.4.0"
tauri-plugin-dialog = "2.3.0"
tauri-plugin-store = "2.4.0"
tauri-plugin-notification = "2.3.1"

# ============================================================
# MACOS SECTION
# ============================================================
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.6.2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
objc = "0.2.7"
tauri-plugin-log = { version = "2.6.0", features = ["colored"] }
time = { version = "0.3", features = ["formatting"] }
core-graphics = "0.23"
cidre = { git = "https://github.com/yury/cidre", rev = "a9587fa", features = ["av"] }
dasp = "0.11.0"
futures-channel = "0.3.31"

# Override whisper-rs with Metal/CoreML on macOS
whisper-rs = { version = "0.13.2", features = ["raw-api", "metal", "coreml"] }

# ============================================================
# WINDOWS SECTION
# ============================================================
[target.'cfg(target_os = "windows")'.dependencies]
futures-channel = "0.3.31"
whisper-rs = { version = "0.13.2", default-features = false, features = ["raw-api"] }

# ============================================================
# LINUX (FIXED — CPU ONLY)
# ============================================================
[target.'cfg(target_os = "linux")'.dependencies]
futures-channel = "0.3.31"
whisper-rs = { version = "0.13.2", default-features = false, features = ["raw-api"] }

# ============================================================
# DEV DEPENDENCIES
# ============================================================
[dev-dependencies]
tempfile = "3.3.0"
infer = "0.15"
criterion = { version = "0.5.1", features = ["async_tokio"] }
memory-stats = "1.0"
futures = "0.3.31"
tracing-subscriber = "0.3.16"

# ============================================================
# PATCHES
# ============================================================
[patch.crates-io]
cpal = { git = "https://github.com/RustAudio/cpal", rev = "51c3b43" }
esaxx-rs = { git = "https://github.com/thewh1teagle/esaxx-rs.git", branch = "feat/dynamic-msvc-link" }
